name: skew
question: >-
  How does skew in the cue-frequency distribution during pretraining trade off
  in-context ordering against reading out the orderings the network has
  learned?
stages: [pretrain]
delta:
  task.cue_distribution.kind: zipf
  task.p_cot: 0.9
axes:
  - name: skew_alpha
    path: task.cue_distribution.skew_alpha
    values: [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 5, 6, 7, 8, 10]
