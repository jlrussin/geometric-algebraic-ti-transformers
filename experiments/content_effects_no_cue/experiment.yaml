name: content_effects_no_cue
question: >-
  When every sequence shows the same cue token, so that a trial does not say whether its items
  follow the frequent cue's ordering, when does the network follow the ordering shown in context
  and when does it follow the ordering it has learned?
stages: [pretrain]
delta:
  task.cue_distribution.kind: frequent_cue
  task.show_cue: false
  pretraining.battery: content
axes:
  - name: frequent_cue_prop
    path: task.cue_distribution.frequent_cue_prop
    values: [0.01, 0.05, 0.1, 0.2, 0.5, 0.8, 1.0]
  - name: p_cot
    path: task.p_cot
    values: [0.5, 0.9, 0.99]
