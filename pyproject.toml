[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geometric-algebraic-ti-transformers"
version = "0.1.0"
description = "Transformer experiments for the paper 'Geometric and algebraic inference in humans and neural networks'"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Jacob Russin" },
    { name = "Joonhwa Kim" },
    { name = "Ellie Pavlick" },
    { name = "Michael J. Frank" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "torch>=2.5,<2.6",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
geo-alg-ti = "geo_alg_ti.cli:main"

[project.urls]
Homepage = "https://github.com/jlrussin/geometric-algebraic-ti-transformers"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_alg_ti"]

[tool.hatch.build.targets.sdist]
include = ["src", "configs", "experiments", "figures", "scripts", "tests", "uv.lock", "REPRODUCE.md", "CITATION.cff"]

# One lock covers both target platforms: a CPU wheel on macOS and a CUDA 12.1
# wheel on Linux for the cluster's Ampere GPUs.
[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
